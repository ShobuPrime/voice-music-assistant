// shairport-sync configuration for ThirdReality voice-music speaker.
//
// Backend: PulseAudio (the same sink the existing sendspin-client and the
//          voice TTS layer write to — PA sequences streams when both are
//          active).
//
// Volume:  "flat" profile so PA's @DEFAULT_SINK@ volume is the single source
//          of truth, keeping AirPlay volume consistent with sendspin and the
//          hardware buttons via the existing /data/conf/sound.json sync loop
//          in sendspin-client.cpp.
//
// Note:    S99ha-speaker passes `-a "$spk_name"` on the command line, which
//          overrides general.name. The "%H" default below is only the
//          fallback if the script is bypassed.

general = {
  name = "%H";
  output_backend = "pa";

  // Sync tolerances tuned for AirPlay 2 group play with HomePods.
  drift_tolerance_in_seconds = 0.005;
  resync_threshold_in_seconds = 0.05;

  // Flat volume: shairport-sync passes the AirPlay volume straight through
  // to PA without applying its own attenuation curve. Combined with
  // volume_max_db = 0 this avoids double-attenuation when the existing
  // sound.json/pactl sync loop also touches the sink.
  volume_control_profile = "flat";
  volume_max_db = 0;

  // 44.1 kHz AirPlay -> 48 kHz hardware sink. soxr gives audibly cleaner
  // resampling than the basic interpolator and is a build dependency we
  // already pull in for AP2.
  interpolation = "soxr";
};

sessioncontrol = {
  // Drop AirPlay session if the source stops sending audio for this long;
  // lets sendspin / voice reclaim the sink without manual intervention.
  session_timeout = 30;
};

pa = {
  application_name = "shairport-sync";
};
