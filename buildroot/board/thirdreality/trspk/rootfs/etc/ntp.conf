driftfile /var/lib/ntp/ntp.drift

# Security: deny external queries/modifications, allow loopback.
restrict default nomodify nopeer noquery limited kod
restrict 127.0.0.1
restrict ::1

# FORK DELTA (jurisdiction): ntpd polls ALL configured servers — there is no
# try-in-order semantics here — so pool.ntp.org was dropped: it is the NTP
# Pool Project's global volunteer round-robin and can resolve to a server
# operated by anyone in any country. NIST (US Dept of Commerce) stratum-1
# first, Cloudflare and Google as fallback.
# Keep this list in sync with NTP_FALLBACK in
# usr/share/udhcpc/default.script.d/ntp-from-dhcp, which regenerates this
# file on every DHCP lease.
server time-d-g.nist.gov iburst
server time-d-wwv.nist.gov iburst
server time.cloudflare.com iburst
server time.google.com iburst
